# Build + lint + test, sau đó deploy Firebase Hosting khi push lên main
name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          VITE_GOOGLE_SCRIPT_URL: ${{ secrets.VITE_GOOGLE_SCRIPT_URL }}
          VITE_SHEETS_TOKEN: ${{ secrets.VITE_SHEETS_TOKEN }}
      - uses: FirebaseExtended/action-hosting-deploy@v0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MEGA645_APP }}
          channelId: live
          projectId: mega645-app
